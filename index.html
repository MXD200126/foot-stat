<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="足疗统计">
<meta name="theme-color" content="#3370ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>足疗提成统计</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent;}
  body{background:#f2f4f7;padding:14px 12px 40px;}
  .wrap{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:18px 16px;box-shadow:0 2px 14px rgba(0,0,0,.06);}
  .head{text-align:center;margin-bottom:14px;}
  .head h1{font-size:19px;font-weight:700;color:#1f2329;}
  .tag{display:inline-block;margin-top:8px;background:linear-gradient(135deg,#c9a227,#eed37b);color:#fff;font-weight:700;font-size:14px;padding:6px 22px;border-radius:999px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:#666;margin-bottom:5px;}
  .field input{width:100%;padding:11px 12px;border:1px solid #e3e6ea;border-radius:10px;font-size:16px;outline:none;background:#fafbfc;}
  .field input:focus{border-color:#3370ff;background:#fff;}
  .tier{background:#f7f8fa;border:1px solid #eef0f3;border-radius:12px;padding:11px 12px;margin-bottom:12px;}
  .tier-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .tier-name{font-size:16px;font-weight:600;color:#1f2329;}
  .tier-rate{font-size:14px;color:#f08a24;font-weight:600;margin-left:6px;}
  .tier .card{width:100%;padding:9px 11px;border:1px solid #e3e6ea;border-radius:9px;font-size:16px;outline:none;background:#fff;}
  .tier .card:focus{border-color:#3370ff;}
  .total{background:#f0f5ff;border-radius:12px;padding:13px 15px;margin:4px 0 16px;}
  .total p{font-size:14px;color:#333;margin:4px 0;display:flex;justify-content:space-between;}
  .total .sum{font-size:18px;font-weight:700;color:#f08a24;border-top:1px dashed #c9d8ff;padding-top:8px;margin-top:6px;}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .btns .full{grid-column:1 / -1;}
  .btn{border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn:active{opacity:.85;}
  .b-blue{background:#3370ff;color:#fff;}
  .b-green{background:#00b42a;color:#fff;}
  .b-red{background:#f53f3f;color:#fff;}
  .preview{margin-top:14px;background:#f7f8fa;border-radius:12px;padding:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;color:#333;min-height:90px;border:1px solid #eef0f3;}
  /* ===== 作者主页：底部按钮 + 弹窗名片 ===== */
  .author-open{width:100%;margin-top:12px;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#3370ff,#00b42a);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;}
  .author-open:active{opacity:.85;}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;}
  .mask.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;z-index:91;padding:18px 18px 30px;transform:translateY(105%);transition:transform .28s ease;max-width:520px;margin:0 auto;}
  .sheet.show{transform:translateY(0);}
  .sheet-bar{width:40px;height:4px;border-radius:2px;background:#e2e6ec;margin:0 auto 16px;}
  .author-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .author-avatar{width:56px;height:56px;flex:none;border-radius:50%;object-fit:cover;display:block;box-shadow:0 2px 8px rgba(51,112,255,.25);border:2px solid #fff;}
  .author-info{flex:1;min-width:0;}
  .author-info .name{font-size:17px;font-weight:700;color:#1f2329;}
  .author-info .desc{font-size:14px;color:#5c6470;margin-top:3px;line-height:1.4;}
  .author-label{font-size:14px;color:#8a929e;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .author-label::after{content:"";flex:1;height:1px;background:#e8ecf2;}
  .plats{display:flex;flex-wrap:wrap;gap:16px 18px;}
  .plat-btn{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;cursor:pointer;padding:0;min-width:52px;}
  .plat-ico{width:52px;height:52px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  .plat-btn span{font-size:14px;color:#5c6470;}
  .plat-sub{font-style:normal;font-size:11px;color:#9aa1ab;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .plat-btn:active{opacity:.8;}
  .sheet-close{width:100%;margin-top:18px;border:1px solid #e2e6ec;background:#fff;border-radius:11px;padding:13px;font-size:15px;font-weight:600;color:#5c6470;cursor:pointer;}
  .sheet-close:active{background:#f5f6f8;}
  .toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;white-space:nowrap;}
  .toast.show{opacity:1;}
</style>
</head>

<div class="wrap">
  <div class="head">
    <h1>足疗提成统计</h1>
    <div class="tag">推荐人：马小东</div>
  </div>

  <div class="field">
    <label>日期（例：8.29夜）</label>
    <input type="text" id="dateTxt" placeholder="如：8.29夜">
  </div>

  <div class="tier">
    <div class="tier-top">
      <div class="tier-name">299 档<span class="tier-rate">3元/单</span></div>
    </div>
    <input class="card" id="card299" placeholder="手牌号，逗号/空格隔开（如 9036,6022）">
  </div>

  <div class="tier">
    <div class="tier-top">
      <div class="tier-name">399 档<span class="tier-rate">4元/单</span></div>
    </div>
    <input class="card" id="card399" placeholder="手牌号，逗号/空格隔开">
  </div>

  <div class="tier">
    <div class="tier-top">
      <div class="tier-name">499 档<span class="tier-rate">5元/单</span></div>
    </div>
    <input class="card" id="card499" placeholder="手牌号，逗号/空格隔开">
  </div>

  <div class="tier">
    <div class="tier-top">
      <div class="tier-name">699 档<span class="tier-rate">7元/单</span></div>
    </div>
    <input class="card" id="card699" placeholder="手牌号，逗号/空格隔开">
  </div>

  <div class="tier">
    <div class="tier-top">
      <div class="tier-name">899 档<span class="tier-rate">9元/单</span></div>
    </div>
    <input class="card" id="card899" placeholder="手牌号，逗号/空格隔开">
  </div>

  <div class="total" id="totalPanel"></div>

  <div class="btns">
    <button class="btn b-green" onclick="copyWork()">复制台账文本</button>
    <button class="btn b-red" onclick="clearAll()">清空全部</button>
  </div>

  <div class="preview" id="preview">统计预览</div>

  <!-- 作者主页入口：底部独立按钮 -->
  <button class="author-open" onclick="openAuthor()">作者主页</button>
</div>

<script>
var KEYS=["299","399","499","699","899"];
// 固定提成：每单金额
var COMM={299:3,399:4,499:5,699:7,899:9};

// 数量自动 = 该档手牌号个数，提成 = 数量 × 每单提成
function calc(){
  var n={},c={},total=0;
  KEYS.forEach(function(k){
    n[k]=cards(k).length;
    c[k]=n[k]*COMM[k];
    total+=c[k];
    document.getElementById("t"+k).textContent=n[k];
    document.getElementById("c"+k).textContent=c[k];
  });
  document.getElementById("sumAll").textContent=total;

  var out="";
  KEYS.forEach(function(k){
    out+=k+"档共"+n[k]+"单，提成"+c[k]+"元（"+COMM[k]+"元/单）\n";
  });
  out+="\n合计总提成："+total+"元";
  document.getElementById("preview").textContent=out;
  saveData();
}

function renderTotal(){
  var html="";
  KEYS.forEach(function(k){
    html+='<p><span>'+k+'档</span><span><b id="t'+k+'">0</b> 单 ｜ 提成 <b id="c'+k+'">0</b> 元</span></p>';
  });
  html+='<p class="sum"><span>合计总提成</span><span id="sumAll">0</span> 元</p>';
  document.getElementById("totalPanel").innerHTML=html;
}

// 手牌号解析：支持英文逗号、中文逗号、顿号、分号、空格、换行等任意分隔
function cards(k){
  var v=document.getElementById("card"+k).value;
  return v.split(/[,，、;；\s]+/).map(function(s){return s.trim();}).filter(Boolean);
}

// 复制台账：每个手牌号单独一行，按输入顺序输出，不出现"无手牌"
function copyWork(){
  var date=document.getElementById("dateTxt").value.trim()||"足疗统计";
  var total=document.getElementById("sumAll").textContent;
  var str=date+"足疗统计\n推荐人：马小东\n共计："+total+"元";
  KEYS.forEach(function(k){
    var arr=cards(k);
    arr.forEach(function(card){
      str+="\n"+card+"一位"+k;
    });
  });
  copy(str,"台账已复制，可直接粘贴微信");
}

function copy(text,msg){
  var done=function(){toast(msg);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){fallbackCopy(text,done);});
  }else{
    fallbackCopy(text,done);
  }
}
function fallbackCopy(text,done){
  var ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);done();
}
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){t.classList.remove("show");},1600);
}

// ===== 作者主页 · 多社交平台 =====
// 每个平台一行：{名, 图标字, 品牌色, 链接或复制文本}
// url 有值 → 点击跳转；copy 有值 → 点击复制该文本（用于微信号等）
var AUTHOR_PLATFORMS = [
  {name:"抖音",  ico:"抖", color:"#111111",  url:"https://v.douyin.com/CsbGLNknlfc/"},
  {name:"微信",  ico:"微", color:"#07c160",  url:"", copy:"DreamyPony_", sub:"DreamyPony_"},
  {name:"快手",  ico:"快", color:"#ff4906",  url:"https://v.kuaishou.com/nJ7V71eR"},
  {name:"QQ",   ico:"Q",  color:"#12b7f5",  url:"https://qm.qq.com/q/TcSgJcxOQ8"},
  {name:"微博",  ico:"博", color:"#e6162d",  url:"https://weibo.com/u/6705404776"},
  {name:"支付宝",ico:"支", color:"#1677ff",  url:"", copy:"0 可以添加好友，还可以转账xOmtCqH99mi http:/ W:/K HU8934 $510", sub:"复制口令"}
];

function renderPlats(){
  var box=document.getElementById("platsBox");
  var html="";
  AUTHOR_PLATFORMS.forEach(function(p){
    html+='<button class="plat-btn" onclick="goPlat(this)" data-url="'+p.url+'" data-copy="'+(p.copy||"")+'">'
        + '<div class="plat-ico" style="background:'+p.color+'">'+p.ico+'</div>'
        + '<span>'+p.name+'</span>'
        + (p.sub?'<em class="plat-sub">'+p.sub+'</em>':"")
        + '</button>';
  });
  box.innerHTML=html;
}

function goPlat(btn){
  var copyText=btn.getAttribute("data-copy");
  var url=btn.getAttribute("data-url");
  if(copyText){
    copy(copyText,"微信号 "+copyText+" 已复制，去微信搜索添加");
    return;
  }
  if(url){
    window.open(url,"_blank");
  }else{
    toast(btn.querySelector("span").textContent+"链接待配置，把链接发我即可绑定");
  }
}

// 打开 / 关闭作者主页弹窗
function openAuthor(){
  document.getElementById("authorMask").classList.add("show");
  document.getElementById("authorSheet").classList.add("show");
}
function closeAuthor(){
  document.getElementById("authorMask").classList.remove("show");
  document.getElementById("authorSheet").classList.remove("show");
}

function clearAll(){
  KEYS.forEach(function(k){
    document.getElementById("card"+k).value="";
  });
  document.getElementById("dateTxt").value="";
  calc();
}

// 本地保存
function saveData(){
  var d={date:document.getElementById("dateTxt").value};
  KEYS.forEach(function(k){
    d["card"+k]=document.getElementById("card"+k).value;
  });
  try{localStorage.setItem("foot_stat_madong",JSON.stringify(d));}catch(e){}
}
function loadData(){
  try{
    var d=JSON.parse(localStorage.getItem("foot_stat_madong"));
    if(!d)return;
    document.getElementById("dateTxt").value=d.date||"";
    KEYS.forEach(function(k){
      document.getElementById("card"+k).value=d["card"+k]||"";
    });
  }catch(e){}
}

KEYS.forEach(function(k){
  document.getElementById("card"+k).addEventListener("input",calc);
});
document.getElementById("dateTxt").addEventListener("input",saveData);

renderTotal();
loadData();
calc();
renderPlats();
</script>
